# Conda environment for IDFD_VENV
#
# To create this environment:
#   conda env create -f environment.yml
#
# To activate this environment:
#   conda activate IDFD_VENV
#
name: IDFD_VENV
channels:
  - pytorch     # For PyTorch and its CUDA dependencies
  - nvidia      # For CUDA-related packages
  - conda-forge # For many community-built packages
  - defaults    # Default Anaconda channel
dependencies:
  # --- Core Conda Dependencies ---
  - python=3.10          # As requested
  - pip                  # To install pip requirements
  
  # --- PyTorch Stack (from Conda) ---
  # Installing from the 'pytorch' channel is the
  # most reliable way to manage CUDA dependencies.
  - pytorch=2.4.0
  - torchvision=0.19
  - torchaudio=2.4.0
  - pytorch-cuda=12.1    # Required by PyTorch 2.4.0
  
  # --- Pip Dependencies (from your requirements.txt) ---
  - pip:
    # ML / DL Frameworks
    - keras==3.3.3
    - tensorflow==2.16.1   # See warning below

    # Hugging Face & Timm
    - accelerate
    - diffusers
    - timm
    - transformers

    # ML/DL Helpers
    - einops==0.8.0
    - mmengine==0.10.6
    - torch-kmeans==0.2.0
    - torchsr==1.0.4
    - xformers

    # Data Science
    - matplotlib==3.9.3
    - opencv-python==4.10.0.84
    - pandas==2.2.3
    - scikit-image==0.22.0
    - scikit-learn==1.5.2
    - sympy==1.13.3

    # Web / API / UI
    - altair==5.5.0
    - fastapi==0.115.6
    - Flask==3.0.3
    - gradio
    - graphene==3.4.1
    - gunicorn==23.0.0
    - uvicorn==0.32.1

    # MLOps & Infrastructure
    - databricks-sdk==0.36.0
    - docker==7.1.0
    - hydra-core==1.3.2
    - mlflow==2.17.2
    - sentry-sdk==2.19.0
    - wandb==0.19.0

    # Utilities
    - beautifulsoup4==4.12.3
    - decord==0.6.0
    - gdown==5.2.0
    - GitPython==3.1.43
    - imageio==2.34.0
    - pydub==0.25.1
    - PyYAML==6.0.2
    - SQLAlchemy==2.0.36
    - tqdm==4.67.1
    - txtorcon==23.11.0
    - yapf==0.43.0
    - albumentations
    - ftfy
    - open-clip-torch